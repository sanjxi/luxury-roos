<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | LuxeStays</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
    <style>
        .admin-nav {
            background-color: #1a2b49;
            color: #fff;
            padding: 1rem 0;
        }

        .stat-card {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #c5a47e;
            margin: 0.5rem 0;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
    </style>
</head>

<body>

    <nav class="admin-nav">
        <div class="container nav-container">
            <a href="#" class="logo" style="color:#fff;">LuxeStays Admin</a>
            <ul class="nav-links">
                <li><span style="color:#c5a47e;">Administrator</span></li>
                <li><a href="#" onclick="Auth.logout()" style="color:#fff;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="padding-top: 3rem;">
        <h1>Dashboard Overview</h1>
        <p>Welcome back, Administrator. Here is today's overview.</p>

        <div class="admin-grid">
            <div class="stat-card">
                <i class="fas fa-bed fa-2x" style="color: #1a2b49;"></i>
                <div class="stat-number">85%</div>
                <p>Occupancy Rate</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-users fa-2x" style="color: #1a2b49;"></i>
                <div class="stat-number">124</div>
                <p>New Guests This Week</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-calendar-check fa-2x" style="color: #1a2b49;"></i>
                <div class="stat-number">12</div>
                <p>Pending Check-ins</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-dollar-sign fa-2x" style="color: #1a2b49;"></i>
                <div class="stat-number">$15k</div>
                <p>Revenue Today</p>
            </div>
        </div>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | LuxeStays</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)),
                url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
        }

        .entry-container {
            max-width: 800px;
            padding: 2rem;
            animation: fadeIn 1.5s ease-out;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .brand-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 4rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .choice-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
        }

        .choice-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            width: 250px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            color: #fff;
        }

        .choice-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: #c5a47e;
            /* Gold accent */
        }

        .choice-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            display: block;
        }

        .choice-desc {
            font-size: 0.9rem;
            opacity: 0.8;
            font-weight: 300;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) translateZ(-50px);
            }

            to {
                opacity: 1;
                transform: translateY(0) translateZ(0);
            }
        }

        .choice-card:nth-child(1) {
            animation: float 6s ease-in-out infinite;
        }

        .choice-card:nth-child(2) {
            animation: float-delay 7s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes float-delay {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }
    </style>
</head>

<body>

    <div class="entry-container">
        <h1 class="brand-title">LuxeStays</h1>
        <p class="brand-subtitle">Experience the Exceptional</p>

        <div class="choice-container">
            <a href="login.html" class="choice-card">
                <span class="choice-title">Guest</span>
                <span class="choice-desc">Book your stay and manage reservations.</span>
            </a>
            <a href="admin/admin-login.html" class="choice-card">
                <span class="choice-title">Staff</span>
                <span class="choice-desc">Authorized personnel and management portal.</span>
            </a>
        </div>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard | LuxeStays</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">LuxeStays</a>
            <ul class="nav-links">
                <!-- Injected by Auth.js -->
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-grid">
            <aside class="sidebar">
                <aside class="sidebar">
                    <!-- Luxury Member Card -->
                    <div class="member-card"
                        style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color:white; padding:1.5rem; border-radius:12px; box-shadow:0 10px 20px rgba(0,0,0,0.2); position:relative; overflow:hidden; margin-bottom:2rem; text-align:left;">
                        <div
                            style="position:absolute; top:-20px; right:-20px; width:100px; height:100px; background:rgba(255,255,255,0.1); border-radius:50%;">
                        </div>

                        <div
                            style="display:flex; justify-content:space-between; align-items:start; margin-bottom:1.5rem;">
                            <i class="fas fa-chip" style="font-size:2rem; color: #ffd700; opacity:0.8;"></i>
                            <!-- Chip Icon -->
                            <div id="loyalty-badge"
                                style="background:rgba(255,255,255,0.2); backdrop-filter:blur(5px); padding:4px 10px; border-radius:4px; font-size:0.7rem; letter-spacing:1px; border:1px solid rgba(255,255,255,0.3);">
                                MEMBER</div>
                        </div>

                        <h3 id="user-name"
                            style="font-family:'Inter', sans-serif; font-weight:600; font-size:1.2rem; margin-bottom:0.2rem; text-shadow:0 2px 4px rgba(0,0,0,0.3);">
                            Loading...</h3>
                        <p id="user-email"
                            style="font-size:0.8rem; opacity:0.8; letter-spacing:0.5px; margin-bottom:1.5rem;">...</p>

                        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                            <div style="font-size:0.7rem; opacity:0.6;">MEMBER ID <br> <span
                                    style="font-size:0.9rem; opacity:1;">8842 1092</span></div>
                            <button onclick="Dashboard.openEditModal()"
                                style="background:none; border:none; color:white; cursor:pointer; font-size:0.9rem; opacity:0.8; transition:all 0.3s;">
                                <i class="fas fa-pen"></i> Edit
                            </button>
                        </div>
                    </div>

                    <h4
                        style="margin-bottom:1rem; color:var(--grey); text-transform:uppercase; font-size:0.8rem; letter-spacing:1px;">
                        Menu</h4>
                    <ul class="sidebar-menu">
                        <li><a href="#" style="color:var(--primary); font-weight:600;"><i class="fas fa-suitcase"
                                    style="width:20px;"></i> My Bookings</a></li>
                    </ul>
                </aside>

                <main>
                    <h2 style="margin-bottom:1.5rem;">My Bookings</h2>
                    <div id="bookings-list">
                        <!-- Injected via JS -->
                    </div>
                </main>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="modal-overlay"
        style="display:none; align-items:center; justify-content:center;">
        <div class="modal"
            style="background:white; padding:2rem; border-radius:8px; width:100%; max-width:400px; position:relative;">
            <span onclick="Dashboard.closeEditModal()"
                style="position:absolute; top:1rem; right:1rem; cursor:pointer; font-size:1.5rem;">&times;</span>
            <h3 style="margin-bottom:1.5rem;">Edit Profile</h3>
            <form id="edit-profile-form">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="edit-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="edit-email" class="form-control" disabled style="background:#f5f5f5;">
                </div>
                <!-- Phone (New) -->
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" id="edit-phone" class="form-control" placeholder="+1 234 567 8900">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Auth.js moved to head -->
    <script src="js/hotels.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Dashboard.init();
        });
    </script>
</body>

</html>

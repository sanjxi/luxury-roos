<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LuxeStays</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">LuxeStays</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="card auth-card">
            <h2 style="text-align:center;">Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>

                <div id="error-msg" style="color:var(--danger); margin-bottom:1rem; display:none;"></div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            <p style="text-align:center; margin-top:1rem;">
                Don't have an account? <a href="register.html"
                    style="color:var(--accent); font-weight:600;">Register</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const result = Auth.login(email, password);

            if (result.success) {
                window.location.href = 'index.html'; // Or redirect to previous page
            } else {
                const msg = document.getElementById('error-msg');
                msg.textContent = result.message;
                msg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
